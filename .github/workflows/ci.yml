name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OJS_DOTNET_SDK_SHA: 0a2699d5aadd60661dc4fcf07b440977f53ea776

jobs:
  test:
    name: .NET 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ojs-dotnet-contrib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: ojs-dotnet-contrib

      - name: Validate coordinated SDK revision and access
        env:
          SDK_READ_TOKEN: ${{ secrets.SDK_READ_TOKEN }}
        run: |
          if ! [[ "$OJS_DOTNET_SDK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Replace OJS_DOTNET_SDK_SHA with the immutable 40-character pre-release SDK commit"
            exit 1
          fi
          test -n "$SDK_READ_TOKEN" || {
            echo "::error::SDK_READ_TOKEN must have read access to the private ojs-dotnet-sdk repository"
            exit 1
          }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: openjobspec/ojs-dotnet-sdk
          ref: ${{ env.OJS_DOTNET_SDK_SHA }}
          path: ojs-dotnet-sdk
          token: ${{ secrets.SDK_READ_TOKEN }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build coordinated SDK package
        run: |
          dotnet restore ../ojs-dotnet-sdk/src/OpenJobSpec/OpenJobSpec.csproj --locked-mode
          dotnet build ../ojs-dotnet-sdk/src/OpenJobSpec/OpenJobSpec.csproj -c Release --no-restore --warnaserror
          dotnet pack ../ojs-dotnet-sdk/src/OpenJobSpec/OpenJobSpec.csproj -c Release --no-build -o artifacts/packages

      - name: Restore coordinated dependencies
        run: |
          dotnet restore OpenJobSpec.Contrib.sln \
            --no-http-cache \
            -p:RestorePackagesWithLockFile=false \
            -p:RestoreLockedMode=false \
            --source "$PWD/artifacts/packages" \
            --source https://api.nuget.org/v3/index.json

      - name: Build with warnings as errors
        run: |
          dotnet build tests/OpenJobSpec.AspNetCore.Tests/OpenJobSpec.AspNetCore.Tests.csproj -c Release --no-restore --warnaserror
          dotnet build tests/OpenJobSpec.WorkerService.Tests/OpenJobSpec.WorkerService.Tests.csproj -c Release --no-restore --warnaserror

      - name: Test
        run: |
          dotnet test tests/OpenJobSpec.AspNetCore.Tests/OpenJobSpec.AspNetCore.Tests.csproj -c Release --no-build
          dotnet test tests/OpenJobSpec.WorkerService.Tests/OpenJobSpec.WorkerService.Tests.csproj -c Release --no-build

      - name: Pack dry run
        run: |
          dotnet pack src/OpenJobSpec.AspNetCore/OpenJobSpec.AspNetCore.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/OpenJobSpec.WorkerService/OpenJobSpec.WorkerService.csproj -c Release --no-build -o artifacts/packages

      - name: Validate package archives
        run: |
          unzip -t artifacts/packages/OpenJobSpec.AspNetCore.0.5.0.nupkg
          unzip -t artifacts/packages/OpenJobSpec.WorkerService.0.5.0.nupkg

      - name: Consumer smoke
        run: |
          rm -rf artifacts/nuget-smoke-cache smoke/OpenJobSpec.Contrib.ConsumerSmoke/obj
          NUGET_PACKAGES="$PWD/artifacts/nuget-smoke-cache" \
          dotnet restore smoke/OpenJobSpec.Contrib.ConsumerSmoke/OpenJobSpec.Contrib.ConsumerSmoke.csproj \
            --no-http-cache \
            -p:RestorePackagesWithLockFile=false \
            -p:RestoreLockedMode=false \
            --source "$PWD/artifacts/packages" \
            --source https://api.nuget.org/v3/index.json
          NUGET_PACKAGES="$PWD/artifacts/nuget-smoke-cache" \
          dotnet build smoke/OpenJobSpec.Contrib.ConsumerSmoke/OpenJobSpec.Contrib.ConsumerSmoke.csproj \
            -c Release \
            --no-restore \
            --warnaserror
          test -f artifacts/nuget-smoke-cache/openjobspec.aspnetcore/0.5.0/openjobspec.aspnetcore.0.5.0.nupkg
          test -f artifacts/nuget-smoke-cache/openjobspec.workerservice/0.5.0/openjobspec.workerservice.0.5.0.nupkg
          test ! -f smoke/OpenJobSpec.Contrib.ConsumerSmoke/packages.lock.json

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenJobSpec-contrib-packages
          path: |
            ojs-dotnet-contrib/artifacts/packages/OpenJobSpec.AspNetCore.*.nupkg
            ojs-dotnet-contrib/artifacts/packages/OpenJobSpec.WorkerService.*.nupkg
